id = "ai-usage"
name = "AI Usage"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Shows Cursor, ChatGPT, and Claude usage in Herdr panes and a dashboard."
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "statusbar"
title = "AI Usage"
placement = "split"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "statusbar"]
platforms = ["windows"]

[[panes]]
id = "dashboard"
title = "AI Usage"
placement = "popup"
width = "80%"
height = 32
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "dashboard"]
platforms = ["windows"]

[[panes]]
id = "statusbar-linux"
title = "AI Usage"
placement = "split"
command = ["sh", "scripts/run-linux.sh", "statusbar"]
platforms = ["linux"]

[[panes]]
id = "dashboard-linux"
title = "AI Usage"
placement = "popup"
width = "80%"
height = 32
command = ["sh", "scripts/run-linux.sh", "dashboard"]
platforms = ["linux"]

[[panes]]
id = "statusbar-macos"
title = "AI Usage"
placement = "split"
command = ["sh", "scripts/run-macos.sh", "statusbar"]
platforms = ["macos"]

[[panes]]
id = "dashboard-macos"
title = "AI Usage"
placement = "popup"
width = "80%"
height = 32
command = ["sh", "scripts/run-macos.sh", "dashboard"]
platforms = ["macos"]

[[actions]]
id = "open"
title = "AI Usage"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "open"]
platforms = ["windows"]

[[actions]]
id = "status"
title = "Show one-line AI usage status"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "status"]
platforms = ["windows"]

[[actions]]
id = "refresh"
title = "Refresh AI usage"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "refresh"]
platforms = ["windows"]

[[actions]]
id = "watch-start"
title = "Start AI usage monitor"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "watch-start"]
platforms = ["windows"]

[[actions]]
id = "open-linux"
title = "Open AI usage (Linux)"
command = ["sh", "scripts/run-linux.sh", "open"]
platforms = ["linux"]

[[actions]]
id = "status-linux"
title = "Show one-line AI usage status (Linux)"
command = ["sh", "scripts/run-linux.sh", "status"]
platforms = ["linux"]

[[actions]]
id = "refresh-linux"
title = "Refresh AI usage (Linux)"
command = ["sh", "scripts/run-linux.sh", "refresh"]
platforms = ["linux"]

[[actions]]
id = "watch-start-linux"
title = "Start AI usage monitor (Linux)"
command = ["sh", "scripts/run-linux.sh", "watch-start"]
platforms = ["linux"]

[[actions]]
id = "open-macos"
title = "Open AI usage (macOS)"
command = ["sh", "scripts/run-macos.sh", "open"]
platforms = ["macos"]

[[actions]]
id = "status-macos"
title = "Show one-line AI usage status (macOS)"
command = ["sh", "scripts/run-macos.sh", "status"]
platforms = ["macos"]

[[actions]]
id = "refresh-macos"
title = "Refresh AI usage (macOS)"
command = ["sh", "scripts/run-macos.sh", "refresh"]
platforms = ["macos"]

[[actions]]
id = "watch-start-macos"
title = "Start AI usage monitor (macOS)"
command = ["sh", "scripts/run-macos.sh", "watch-start"]
platforms = ["macos"]

[[startup]]
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run-windows.ps1", "watch-start"]
platforms = ["windows"]

[[startup]]
command = ["sh", "scripts/run-linux.sh", "watch-start"]
platforms = ["linux"]

[[startup]]
command = ["sh", "scripts/run-macos.sh", "watch-start"]
platforms = ["macos"]
